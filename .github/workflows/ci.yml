# CI — roda a cada push (qualquer branch) e em PRs para a main. Lugar oficial dos testes (D-046).
# CD (publicação de imagem / deploy) fica para depois — ver docs/DECISOES.md D-046.
name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Unitários (*Test, Surefire) + integração (*IT, Failsafe) + relatório JaCoCo.
      # Testcontainers usa o Docker já disponível no runner ubuntu-latest.
      - name: Build e testes
        run: ./mvnw -B -ntp verify

      - name: Relatórios de teste
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-teste-backend
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Relatório de cobertura (JaCoCo)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-backend
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend — testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (angular-eslint)
        run: npm run lint

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Testes unitários (Vitest)
        run: npm test -- --watch=false

      - name: Build de produção
        run: npm run build

  docker:
    name: Docker — compose e imagens
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Valida o compose.yaml com os valores fictícios do .env.example.
      - name: Validar compose.yaml
        run: |
          cp .env.example .env
          docker compose --profile app config --quiet

      # Só constrói as imagens (não publica — CD adiado).
      - name: Construir imagem do backend
        run: docker build --tag clinica-viene-backend:ci backend

      - name: Construir imagem do frontend
        run: docker build --tag clinica-viene-frontend:ci frontend

  e2e:
    name: E2E — navegador (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # CPF e senha FICTÍCIOS do usuário DEV inicial, só para este ambiente descartável de CI.
      E2E_DEV_CPF: '526.018.159-06'
      E2E_DEV_SENHA: 'Provisoria#Dev2026'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # .env descartável: chaves geradas na hora (nunca reaproveitadas) e o DEV inicial fictício.
      - name: Gerar .env do ambiente de teste
        run: |
          cp .env.example .env
          export CRIPTO_CHAVES="v1:$(openssl rand -base64 32)"
          export CPF_HMAC_CHAVE="$(openssl rand -base64 32)"
          export JWT_CHAVE_PRIVADA="$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 | openssl pkcs8 -topk8 -nocrypt -outform DER | base64 -w0)"
          export DEV_INICIAL_CPF="$E2E_DEV_CPF" DEV_INICIAL_NOME="Dev Ficticio" DEV_INICIAL_EMAIL="dev.e2e@exemplo.com" DEV_INICIAL_SENHA="$E2E_DEV_SENHA"
          python3 - <<'PY'
          import os, re
          caminho = ".env"
          texto = open(caminho).read()
          for chave in ["CRIPTO_CHAVES", "CPF_HMAC_CHAVE", "JWT_CHAVE_PRIVADA", "DEV_INICIAL_CPF", "DEV_INICIAL_NOME", "DEV_INICIAL_EMAIL", "DEV_INICIAL_SENHA"]:
              texto = re.sub(rf"^{chave}=.*$", lambda m, c=chave: f"{c}={os.environ[c]}", texto, flags=re.M)
          open(caminho, "w").write(texto)
          PY

      - name: Subir o ambiente completo
        run: docker compose --profile app up -d --build

      - name: Aguardar backend e frontend
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/actuator/health >/dev/null && curl -fs http://localhost:4200 >/dev/null; then
              echo "ambiente pronto"; exit 0
            fi
            sleep 5
          done
          echo "ambiente não subiu a tempo"; docker compose --profile app logs; exit 1

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências e navegador
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Testes E2E
        working-directory: frontend
        run: npx playwright test

      - name: Logs do ambiente (em caso de falha)
        if: failure()
        run: docker compose --profile app logs --no-color > ambiente.log 2>&1 || true

      - name: Relatório do Playwright e logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-e2e
          path: |
            frontend/playwright-report/
            frontend/test-results/
            ambiente.log
          if-no-files-found: ignore
          retention-days: 7
