spring:
  application:
    name: clinica-viene
  config:
    # Em dev (rodando a partir de backend/), lê as variáveis do .env da raiz. Em produção o arquivo não existe
    # e as variáveis vêm do ambiente.
    import: optional:file:../.env[.properties]
  mvc:
    problemdetails:
      enabled: true
  mail:
    # Em dev, Mailpit (docker compose); em produção, o provedor de e-mail contratado.
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
  thymeleaf:
    # Templates (PDFs/e-mails) entram nas próximas fases.
    check-template-location: false
  jpa:
    open-in-view: false
    hibernate:
      # Schema só via Flyway (D-047): o Hibernate apenas valida.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # Datas sempre em UTC no banco; exibição em America/Bahia fica no frontend/relatórios.
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  modulith:
    events:
      # Eventos concluídos vão para event_publication_archive (nada é apagado) — D-059.
      completion-mode: archive
      # Eventos não concluídos (ex.: app caiu no meio) são reprocessados ao reiniciar.
      republish-outstanding-events-on-restart: true
      jdbc:
        # Schema dos eventos só via Flyway (V2, V3). Usamos o starter JPA; isto garante que,
        # se o starter JDBC entrar um dia, ele não crie tabelas por conta própria.
        schema-initialization:
          enabled: false
  docker:
    compose:
      # Em dev (rodando pela IDE a partir de backend/), sobe a infraestrutura do compose.yaml da raiz.
      file: ../compose.yaml

springdoc:
  # OpenAPI/Swagger UI desligados por padrão (produção); ligue com OPENAPI_HABILITADO=true em dev.
  api-docs:
    enabled: ${OPENAPI_HABILITADO:false}
  swagger-ui:
    enabled: ${OPENAPI_HABILITADO:false}
  paths-to-match: /api/v1/**

clinicaviene:
  openapi:
    habilitado: ${OPENAPI_HABILITADO:false}
  cripto:
    # D-052 — sem estas chaves a aplicação não sobe (valores vazios falham na validação).
    chaves: ${CRIPTO_CHAVES:}
    chave-ativa: ${CRIPTO_CHAVE_ATIVA:}
    cpf-hmac-chave: ${CPF_HMAC_CHAVE:}
  auth:
    # D-071 — chave privada RSA (PKCS#8, em Base64 numa linha só). Sem ela a aplicação não sobe.
    # Gerar: openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 | openssl pkcs8 -topk8 -nocrypt -outform DER | base64 -w0
    chave-privada-jwt: ${JWT_CHAVE_PRIVADA:}
    duracao-token-acesso: 15m
    duracao-sessao: 12h
    # Janela em que um token já usado ainda é tratado como renovação concorrente (várias abas), sem revogar.
    tolerancia-renovacao-concorrente: 20s
    duracao-desafio: 5m
    tentativas-desafio: 5
    # Cookie só via HTTPS (navegadores tratam http://localhost como seguro em dev).
    cookie-seguro: ${AUTH_COOKIE_SEGURO:true}
    # Rate limit do login (Bucket4j, em memória).
    limite-login-por-ip: 20
    limite-falhas-por-cpf: 5
    janela-limite-tentativas: 15m
  email:
    remetente: ${EMAIL_REMETENTE:nao-responda@clinicaviene.local}
  envio-codigo:
    # D-073 — espera antes do 2º, 3º, 4º e 5º envio; máximo de 5 envios; depois, só após 1 hora.
    esperas: 1m, 2m, 5m, 10m
    maximo-envios: 5
    bloqueio: 1h
    validade: 10m
    tentativas: 5
  convite:
    # Endereço do frontend usado no link do convite (D-091).
    url-publica: ${APP_URL_PUBLICA:http://localhost:4200}
    validade-link: 72h
    validade-quiosque: 2h
  cadastro-publico:
    # Tempo para o paciente preencher depois de confirmar a identidade (D-100).
    validade-sessao: 2h
    # Modelo de anamnese do cadastro (enquanto o convite não escolhe a área).
    area-anamnese: ODONTOLOGIA
  dev-inicial:
    # D-048 — só usados com o banco sem usuários; depois remova do ambiente.
    cpf: ${DEV_INICIAL_CPF:}
    nome: ${DEV_INICIAL_NOME:}
    email: ${DEV_INICIAL_EMAIL:}
    senha: ${DEV_INICIAL_SENHA:}

server:
  # Atrás do nginx: usa X-Forwarded-For/Proto (só de proxies em rede interna) para o IP real na auditoria.
  forward-headers-strategy: native

management:
  health:
    mail:
      # E-mail fora do ar não torna a aplicação indisponível (o usuário pode pedir reenvio);
      # sem isto, o /actuator/health ficaria DOWN e o container poderia ser reiniciado à toa.
      enabled: false
