# Ambiente de desenvolvimento — D-050.
#   docker compose up -d                       -> só infraestrutura (Postgres, Mailpit, SeaweedFS)
#   docker compose --profile app up -d --build -> infraestrutura + backend + frontend em container
#                                                 (frontend em http://localhost:4200, /api/ vai para o backend)
# Credenciais vêm do .env (fora do Git). Crie com: cp .env.example .env
# Ao rodar o backend pela IDE, o spring-boot-docker-compose usa este arquivo (spring.docker.compose.file).
# Storage S3 local: SeaweedFS, só para dev/teste (D-056). Storage de produção: A CONFIRMAR (D-060).

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      # Só na máquina local (não expõe na rede).
      - "127.0.0.1:${POSTGRES_PORTA:-5432}:5432"
    volumes:
      # A partir do Postgres 18 o volume é montado em /var/lib/postgresql.
      - postgres-dados:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    # Captura todos os e-mails enviados em dev (nada sai para a internet). Interface: http://localhost:8025
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:${MAILPIT_PORTA_SMTP:-1025}:1025"
      - "127.0.0.1:${MAILPIT_PORTA_WEB:-8025}:8025"

  seaweedfs:
    # Storage S3 compatível (Apache-2.0) só para dev/teste — D-056. O código usa apenas o AWS SDK S3
    # com endpoint configurável, então o storage é intercambiável.
    # Sem autenticação S3 em dev (porta só em 127.0.0.1); credenciais entram com o módulo de documentos (Fase 2).
    image: chrislusf/seaweedfs:4.55
    command: server -dir=/data -s3 -s3.port=8333
    ports:
      - "127.0.0.1:${SEAWEEDFS_PORTA_S3:-8333}:8333"
    volumes:
      - seaweedfs-dados:/data

  backend:
    profiles: [app]
    image: clinica-viene-backend:local
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      OPENAPI_HABILITADO: ${OPENAPI_HABILITADO:-false}
      CRIPTO_CHAVES: ${CRIPTO_CHAVES:?defina CRIPTO_CHAVES no .env}
      CRIPTO_CHAVE_ATIVA: ${CRIPTO_CHAVE_ATIVA:?defina CRIPTO_CHAVE_ATIVA no .env}
      CPF_HMAC_CHAVE: ${CPF_HMAC_CHAVE:?defina CPF_HMAC_CHAVE no .env}
      JWT_CHAVE_PRIVADA: ${JWT_CHAVE_PRIVADA:?defina JWT_CHAVE_PRIVADA no .env}
      APP_URL_PUBLICA: ${APP_URL_PUBLICA:-http://localhost:4200}
      DEV_INICIAL_CPF: ${DEV_INICIAL_CPF:-}
      DEV_INICIAL_NOME: ${DEV_INICIAL_NOME:-}
      DEV_INICIAL_EMAIL: ${DEV_INICIAL_EMAIL:-}
      DEV_INICIAL_SENHA: ${DEV_INICIAL_SENHA:-}
    ports:
      - "127.0.0.1:${BACKEND_PORTA:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    profiles: [app]
    image: clinica-viene-frontend:local
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORTA:-4200}:8080"
    depends_on:
      - backend

volumes:
  postgres-dados:
  seaweedfs-dados:
